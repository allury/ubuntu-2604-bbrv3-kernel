name: Generate BBRv3 port patch

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Ubuntu kernel git tag to port onto'
        required: true
        default: 'Ubuntu-7.0.0-30.30'
      google_ref:
        description: 'google/bbr ref providing official BBRv3'
        required: true
        default: 'v3'
      vanilla_ref:
        description: 'pristine stable tag matching the google/bbr base'
        required: true
        default: 'v6.13.7'

permissions: {}

concurrency:
  group: bbrv3-portgen
  cancel-in-progress: false

jobs:
  generate:
    name: Construct and validate the self-ported patch
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      GOOGLE_REF: ${{ inputs.google_ref }}
      VANILLA_REF: ${{ inputs.vanilla_ref }}
    steps:
      - name: Prepare tooling
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 diffutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch the three source trees
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$GOOGLE_REF" https://github.com/google/bbr google
          git clone --depth=1 --branch "$VANILLA_REF" https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git vanilla
          git clone --depth=1 --branch "$SOURCE_TAG" https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute base
      - name: Run the port constructor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/port-bbrv3.py base/ vanilla/ google/ ported/
      - name: Generate the git-format patch
        shell: bash
        run: |
          set -euo pipefail
          source_version="${SOURCE_TAG#Ubuntu-}"
          source_version="${source_version%%-*}"
          while IFS= read -r rel; do
            install -D -m 0644 "ported/$rel" "base/$rel"
          done < <(find ported -type f -printf '%P\n')
          ( cd base && git diff --no-renames -- ) > "bbrv3-ubuntu-${source_version}.patch"
          test -s "bbrv3-ubuntu-${source_version}.patch"
          wc -l "bbrv3-ubuntu-${source_version}.patch"
      - name: Validate exact application
        shell: bash
        run: |
          set -euo pipefail
          source_version="${SOURCE_TAG#Ubuntu-}"
          source_version="${source_version%%-*}"
          git -C base checkout -- .
          git -C base apply --check --whitespace=error "$GITHUB_WORKSPACE/bbrv3-ubuntu-${source_version}.patch"
          git -C base apply --stat "$GITHUB_WORKSPACE/bbrv3-ubuntu-${source_version}.patch"
      - name: Audit against Google official and the current patch
        shell: bash
        run: |
          set -euo pipefail
          source_version="${SOURCE_TAG#Ubuntu-}"
          source_version="${source_version%%-*}"
          cat > /tmp/port-audit.py <<'PY'
import collections
import pathlib
for rel in sorted(p for p in pathlib.Path('ported').rglob('*') if p.is_file()):
    r = str(rel.relative_to('ported'))
    g = pathlib.Path('google') / r
    if not g.exists():
        print(f"{r}: no google counterpart (expected for tcp_ecn.h routing)")
        continue
    a = collections.Counter(g.read_text().splitlines())
    b = collections.Counter(rel.read_text().splitlines())
    only_g = sum((a - b).values())
    only_p = sum((b - a).values())
    print(f"{r}: googleOnly={only_g} portOnly={only_p}")
PY
          # Reference tree: base + the currently shipped patch.
          cp -a base reference
          git -C reference apply --whitespace=error "$GITHUB_WORKSPACE/patches/bbrv3-ubuntu-${source_version}.patch"
          {
            echo "== ordered diff: self-ported vs current patched tree =="
            while IFS= read -r rel; do
              if ! diff -u "reference/$rel" "ported/$rel" > /dev/null 2>&1; then
                echo "--- $rel ---"
                diff -u "reference/$rel" "ported/$rel" || true
              else
                echo "IDENTICAL $rel"
              fi
            done < <(find ported -type f -printf '%P\n')
            echo
            echo "== multiset delta: self-ported vs Google v3 final files =="
            python3 /tmp/port-audit.py
          } > audit-report.txt
          head -80 audit-report.txt
      - name: Preserve outputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: bbrv3-port-${{ github.run_id }}
          path: |
            bbrv3-ubuntu-*.patch
            porting-report.txt
            audit-report.txt
          if-no-files-found: error
