name: Network behaviour report

# Compare CUBIC and BBRv1 on the cloud image's own kernel with CUBIC and BBRv3
# on the latest stable release, through an emulated bottleneck inside one KVM
# guest. The report is informational and never gates a release.
on:
  workflow_dispatch:
  push:
    paths:
      - tests/vm-network-test.py
      - tests/vm-network-report.sh
      - .github/workflows/network-report.yml

permissions: {}

concurrency:
  group: network-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Measure CUBIC, BBRv1 and BBRv3 through an emulated bottleneck
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          tag="$(jq -r .tag_name <<<"$release_json")"
          [[ "$tag" =~ ^ubuntu-26\.04-bbrv3-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.[0-9]+(\.[0-9]+)*-p[1-9][0-9]*$ ]]
          [[ "$(jq -r .prerelease <<<"$release_json")" == false ]]
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release
          (cd release && sha256sum --check --strict SHA256SUMS)
          image_package="$(dpkg-deb -f release/linux-image-unsigned-*.deb Package)"
          kernel_release="${image_package#linux-image-unsigned-}"
          printf 'KERNEL_RELEASE=%s\n' "$kernel_release" >> "$GITHUB_ENV"
          printf '测量对象：已发布的 %s（%s）。\n\n' "$tag" "$kernel_release" >> "$GITHUB_STEP_SUMMARY"

      - name: Install QEMU and the Ubuntu cloud image keyring
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ubuntu-cloudimage-keyring

      - name: Let QEMU use KVM when the runner provides it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          else
            echo '::warning::This runner has no /dev/kvm; measurements under TCG emulation are not meaningful.'
          fi

      - name: Measure before and after installing the release
        shell: bash
        run: bash tests/vm-install-reboot.sh release "$KERNEL_RELEASE" network

      - name: Write the report
        shell: bash
        run: |
          set -euo pipefail
          bash tests/vm-network-report.sh vm-console.log network-report.md
          cat network-report.md >> "$GITHUB_STEP_SUMMARY"
          # Also as an annotation, which is readable without signing in.
          report="$(< network-report.md)"
          report="${report//'%'/'%25'}"
          printf '\n::notice title=Network behaviour report::%s\n' "${report//$'\n'/'%0A'}"

      - name: Preserve the report and the VM console log
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: network-report
          path: |
            network-report.md
            vm-console.log
          if-no-files-found: ignore
