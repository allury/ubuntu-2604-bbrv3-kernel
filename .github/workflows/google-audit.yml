name: Google BBRv3 audit

# Compare every BBRv3 patch with the Google BBRv3 release it was ported from
# (patches/GOOGLE-REFERENCE), and check that each committed report under
# docs/google-audit/ is reproduced byte for byte. The audit is for review and
# never gates a release.
on:
  workflow_dispatch:
  push:
    paths:
      - patches/**
      - scripts/audit-google-bbrv3.sh
      - docs/google-audit/**
      - .github/workflows/google-audit.yml

permissions: {}

concurrency:
  group: google-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  UBUNTU_KERNEL_REPOSITORY: https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute

jobs:
  audit:
    name: Compare the patches with Google BBRv3
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit every BBRv3 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/bbrv3-ubuntu-*.patch)
          (( ${#patches[@]} > 0 ))
          for patch in "${patches[@]}"; do
            name="$(basename "$patch" .patch)"
            ./scripts/audit-google-bbrv3.sh patches/GOOGLE-REFERENCE "$patch" audit-git "audit/$name.txt"
          done

      - name: Compare with the committed reports
        shell: bash
        run: |
          set -euo pipefail
          # Annotations can be read without signing in; the runner cuts their
          # messages at 4096 characters.
          escape() {
            local text="$1"
            text="${text//'%'/'%25'}"
            text="${text//$'\r'/}"
            printf '%s' "${text//$'\n'/'%0A'}"
          }
          status=0
          for report in audit/*.txt; do
            committed="docs/google-audit/$(basename "$report")"
            summary="$(sed -n '/^Patch: /,/^$/p' "$report")"
            if [[ ! -f "$committed" ]]; then
              printf '::warning title=Google BBRv3 audit::%s has no committed report yet. Review it and commit it as %s.%%0A%%0A%s\n' \
                "$(basename "$report")" "$committed" "$(escape "$summary")"
            elif cmp -s "$committed" "$report"; then
              printf '::notice title=Google BBRv3 audit::%s is reproduced byte for byte.%%0A%%0A%s\n' \
                "$committed" "$(escape "$summary")"
            else
              difference="$(diff -u "$committed" "$report" | head -c 3500 || true)"
              printf '::error title=Google BBRv3 audit::%s differs from a fresh run. Review the new report and commit it.%%0A%%0A%s\n' \
                "$committed" "$(escape "$difference")"
              status=1
            fi
            {
              printf '### %s\n\n```text\n%s\n```\n\n' "$(basename "$report")" "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Look for newer Google BBRv3 releases
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          reference() {
            awk -v key="$1" '$1 == key { print $2 }' patches/GOOGLE-REFERENCE
          }
          repository="$(reference google-repository)"
          tag="$(reference google-tag)"
          commit="$(reference google-commit)"
          since="$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$tag" || true)"
          # Informational: Google names its BBRv3 releases and branches by date.
          newer="$(git ls-remote --heads --tags "$repository" | awk -v since="$since" -v pinned="$commit" '
            {
              name = $2
              sub(/^refs\/(heads|tags)\//, "", name)
              sub(/\^\{\}$/, "", name)
              if (name == "v3" && $1 != pinned)
                print name " now points at " substr($1, 1, 12)
              else if (name ~ /bbr/ && match(name, /20[0-9][0-9]-[01][0-9]-[0-3][0-9]/) &&
                       substr(name, RSTART, RLENGTH) > since && $1 != pinned && !seen[name]++)
                print name " (" substr($1, 1, 12) ")"
            }')"
          if [[ -n "$newer" ]]; then
            printf '::notice title=Newer Google BBRv3 references::Newer than %s:%%0A%s\n' "$tag" "${newer//$'\n'/'%0A'}"
            printf 'Google 有比 %s 更新的 BBRv3 分支或标签：\n\n```text\n%s\n```\n' "$tag" "$newer" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the reports as check runs
        if: ${{ !cancelled() && hashFiles('audit/*.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Job summaries and artifacts need a GitHub login, while check runs
          # can be read by anyone, so the full reports go there too. A check
          # run's text holds at most 65535 characters.
          for report in audit/*.txt; do
            name="$(basename "$report" .txt)"
            summary="$(sed -n '/^Patch: /,/^$/p' "$report")"
            rm -rf parts
            mkdir parts
            LC_ALL=C awk -v dir=parts '
              BEGIN { part = 1 }
              size > 0 && size + length($0) + 1 > 60000 { part++; size = 0 }
              { print > (dir "/" part); size += length($0) + 1 }
            ' "$report"
            count="$(find parts -type f | wc -l)"
            for (( part = 1; part <= count; part++ )); do
              title="Google BBRv3 audit: $name"
              (( count == 1 )) || title="$title ($part/$count)"
              jq -n --arg name "$title" --arg sha "$GITHUB_SHA" --arg summary "$summary" \
                --rawfile text "parts/$part" '{
                  name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
                  output: {
                    title: $name,
                    summary: ("```text\n" + $summary + "\n```"),
                    text: ("```text\n" + $text + "```")
                  }
                }' |
                gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .html_url
            done
          done

      - name: Preserve the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: google-bbrv3-audit
          path: audit/*.txt
          if-no-files-found: ignore
