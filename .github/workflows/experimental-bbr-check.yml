name: Experimental BBR research checks
on:
  workflow_dispatch:
  push:
    branches: [experiment/google-bbrv3-port]
    paths: ['experiments/google-bbrv3/**', '.github/workflows/experimental-bbr-check.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check syntax and plan-only behavior
        run: |
          python3 -m compileall -q experiments/google-bbrv3
          python3 experiments/google-bbrv3/test_network_matrix.py
          python3 experiments/google-bbrv3/network_matrix.py
